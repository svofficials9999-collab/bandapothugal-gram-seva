<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>బండపోతుగల్ గ్రామ సేవ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0f1e;color:#e8ecf4;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:
 radial-gradient(600px 400px at 80% -10%,rgba(34,197,94,.14),transparent 60%),
 radial-gradient(500px 380px at -10% 40%,rgba(59,130,246,.12),transparent 60%),
 radial-gradient(500px 400px at 60% 110%,rgba(168,85,247,.10),transparent 60%),#0a0f1e}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:0;z-index:10;background:rgba(10,15,30,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07);margin:0 -14px;padding:12px 14px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#14532d,#166534 40%,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(34,197,94,.35);flex:none}
h1{font-size:19px;font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,#4ade80,#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11px;color:#9aa7bd;margin-top:2px;line-height:1.4}
.hbtns{margin-left:auto;display:flex;gap:8px}
.pill{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#e8ecf4;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer}
.pill:active{transform:scale(.95)}
.pill.call{background:linear-gradient(135deg,#059669,#10b981);border:none;box-shadow:0 3px 10px rgba(16,185,129,.4);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.emg{margin:14px 0 4px;background:linear-gradient(135deg,rgba(220,38,38,.16),rgba(220,38,38,.06));border:1px solid rgba(248,113,113,.3);border-radius:16px;padding:12px}
.emg .et{font-size:12px;font-weight:800;color:#fca5a5;letter-spacing:.5px;margin-bottom:8px}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ebtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.07);border:1px solid rgba(248,113,113,.35);border-radius:12px;padding:9px 4px;text-decoration:none;color:#fff}
.ebtn b{font-size:17px;color:#f87171}
.ebtn span{font-size:10px;color:#d7dce6;text-align:center;line-height:1.25}
.ebtn:active{transform:scale(.94)}
.secs{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px 14px;cursor:pointer;transition:.15s}
.sec:active{transform:scale(.96)}
.sec .ic{font-size:30px}
.sec h2{font-size:17px;margin:8px 0 3px;font-weight:800}
.sec p{font-size:11px;color:#9aa7bd}
.back{display:none;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#e8ecf4;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;margin:14px 0 4px}
.back:active{transform:scale(.95)}
.sectitle{display:none;margin:10px 0 12px;align-items:center;gap:10px}
.sectitle .ic{font-size:26px}
.sectitle h2{font-size:20px;font-weight:800}
.listenall{margin-left:auto;font-size:11px;border:1px solid rgba(96,165,250,.4);background:rgba(59,130,246,.14);color:#93c5fd;border-radius:16px;padding:7px 12px;font-weight:700;cursor:pointer}
.cards{display:none;flex-direction:column;gap:12px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px}
.card h3{font-size:15.5px;font-weight:800;margin-bottom:6px;line-height:1.35}
.card .desc{font-size:13px;color:#c4cddd;line-height:1.6}
.meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:10.5px;border-radius:12px;padding:4px 9px}
.chip.src{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(96,165,250,.3);text-decoration:none}
.chip.upd{background:rgba(255,255,255,.06);color:#8b97ab;border:1px solid rgba(255,255,255,.1)}
.cbtns{margin-top:10px;display:flex;gap:8px}
.cbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px;font-size:12.5px;font-weight:800;cursor:pointer;text-decoration:none;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#e8ecf4}
.cbtn:active{transform:scale(.95)}
.cbtn.listen{background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;box-shadow:0 3px 12px rgba(168,85,247,.35)}
.cbtn.open{background:linear-gradient(135deg,#1d4ed8,#3b82f6);border:none;color:#fff;box-shadow:0 3px 12px rgba(59,130,246,.35)}
.cbtn.tel{background:linear-gradient(135deg,#059669,#10b981);border:none;color:#fff}
.note{margin-top:18px;font-size:11px;color:#7d8aa0;line-height:1.6;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
footer{margin-top:22px;text-align:center;font-size:12px;color:#8b97ab}
footer b{color:#c9d4e4}
#installBtn{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-size:24px;box-shadow:0 6px 20px rgba(16,185,129,.5);cursor:pointer;display:none;align-items:center;justify-content:center}
#installBtn.done{background:linear-gradient(135deg,#166534,#22c55e)}
#installBtn:active{transform:scale(.92)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1e293b;border:1px solid rgba(255,255,255,.15);color:#e8ecf4;font-size:12.5px;padding:11px 16px;border-radius:12px;z-index:60;display:none;max-width:86%;text-align:center;line-height:1.5}
.offb{display:none;position:sticky;top:66px;z-index:9;margin:10px 0 0;background:rgba(217,119,6,.16);border:1px solid rgba(251,191,36,.45);color:#fcd34d;font-size:12px;font-weight:700;border-radius:12px;padding:9px 12px;line-height:1.45}
.sbox{margin:14px 0 0}
.sbox input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:13px 16px;font-size:15px;color:#e8ecf4;outline:none}
.sbox input:focus{border-color:#4ade80}
.sbox input::placeholder{color:#7d8aa0}
.notices{margin:14px 0 0;background:rgba(59,130,246,.08);border:1px solid rgba(96,165,250,.25);border-radius:16px;padding:12px}
.notices .nt{font-size:12px;font-weight:800;color:#93c5fd;letter-spacing:.4px;margin-bottom:6px}
.nitem{font-size:12.5px;color:#c4cddd;line-height:1.55;padding:7px 0;border-top:1px dashed rgba(255,255,255,.1)}
.nitem .ntag{font-size:10px;border-radius:10px;padding:2px 8px;margin-right:6px}
.nitem .off{background:rgba(34,197,94,.18);color:#4ade80}
.nitem .unoff{background:rgba(251,191,36,.15);color:#fcd34d}
.nitem .nd{color:#7d8aa0;font-size:11px}
.nempty{font-size:12px;color:#7d8aa0}
.dets{margin-top:9px;border-top:1px dashed rgba(255,255,255,.12);padding-top:8px}
.det{display:flex;gap:8px;font-size:12.5px;color:#c4cddd;margin-top:5px;line-height:1.5}
.det b{color:#e8ecf4}
.dic{flex:none}
.disc{color:#8b97ab;font-size:11px;margin-top:8px}
.ever{font-size:10px;color:#7d8aa0;margin-top:8px}
.srctag{font-size:11px;font-weight:800;color:#8b97ab;margin:4px 0 -4px}
.empty{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.15);border-radius:14px;padding:18px;text-align:center;font-size:13px;color:#9aa7bd;line-height:1.6}
:focus-visible{outline:2px solid #4ade80;outline-offset:2px;border-radius:8px}
.frm label{display:block;font-size:13px;font-weight:700;color:#c4cddd;margin:12px 0 5px}
.frm input,.frm textarea,.frm select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 14px;font-size:15px;color:#e8ecf4;outline:none;font-family:inherit}
.frm input:focus,.frm textarea:focus,.frm select:focus{border-color:#4ade80}
.frm textarea{min-height:90px;resize:vertical}
.frm select{appearance:none}
.privacy{margin-top:12px;font-size:11.5px;color:#9aa7bd;line-height:1.6;background:rgba(251,191,36,.08);border:1px dashed rgba(251,191,36,.35);border-radius:12px;padding:10px 12px}
.sendbtn{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#16a34a,#22c55e);border:none;color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(34,197,94,.4);text-decoration:none}
.sendbtn:active{transform:scale(.97)}
.mailchip{font-size:10.5px;border-radius:12px;padding:4px 9px;background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.3);text-decoration:none}
.unv{background:rgba(251,191,36,.12);color:#fcd34d;border:1px solid rgba(251,191,36,.35)}
.stopbtn{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-size:22px;box-shadow:0 6px 20px rgba(239,68,68,.5);cursor:pointer;display:none;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap" role="main">
<header role="banner">
  <div class="hrow">
    <div class="logo">🌾</div>
    <div>
      <h1 id="appTitle">బండపోతుగల్ గ్రామ సేవ</h1>
      <div class="sub" id="villageLine"></div>
    </div>
    <div class="hbtns">
      <button class="pill" id="langBtn">EN</button>
      <a class="pill call" href="tel:+919177226638" id="helpBtn">📞 <span id="helpLbl">సహాయం</span></a>
    </div>
  </div>
</header>

<div class="offb" id="offBanner" role="status"></div>

<div class="sbox"><input id="searchBox" type="search" autocomplete="off" aria-label="Search schemes"></div>

<div class="emg" id="emgBox">
  <div class="et" id="emgTitle">🚨 అత్యవసర నంబర్లు</div>
  <div class="egrid" id="emgGrid"></div>
  <div class="ever" id="emgVer"></div>
</div>

<div class="notices" id="noticeBox"><div class="nt" id="ntTitle"></div><div id="ntList"></div></div>

<div class="secs" id="secGrid"></div>
<div class="cards" id="searchResults" style="display:none"></div>

<button class="back" id="backBtn">← <span id="backLbl">వెనుకకు</span></button>
<div class="sectitle" id="secTitle">
  <span class="ic" id="stIcon"></span><h2 id="stName"></h2>
  <button class="listenall" id="listenAll">🔊 <span id="listenAllLbl">అన్నీ వినండి</span></button>
</div>
<div class="cards" id="cardList"></div>

<div class="note" id="note"></div>
<footer id="foot"></footer>
</div>

<button class="stopbtn" id="stopBtn" title="Stop">⏹</button>
<button id="installBtn" title="Install">⬇️</button>
<div id="toast"></div>

<script src="schemes.js"></script>
<script src="details.js"></script>
<script>
let lang = localStorage.getItem('gs.lang') || 'te';
const D = window.GS_DATA;
const $ = id => document.getElementById(id);
const T = (te,en) => lang==='te' ? te : en;

function render(){
  document.documentElement.lang = lang;
  $('appTitle').textContent = T('బండపోతుగల్ గ్రామ సేవ','Bandapothugal Gram Seva');
  $('villageLine').textContent = T(D.village.te, D.village.en);
  $('langBtn').textContent = lang==='te' ? 'EN' : 'తె';
  $('helpLbl').textContent = T('సహాయం','Help');
  $('emgTitle').textContent = T('🚨 అత్యవసర నంబర్లు','🚨 Emergency numbers');
  $('backLbl').textContent = T('వెనుకకు','Back');
  $('listenAllLbl').textContent = T('అన్నీ వినండి','Listen to all');
  $('note').textContent = T(
    'గమనిక: ఈ సమాచారమంతా అధికారిక ప్రభుత్వ వెబ్‌సైట్ల నుండి మాత్రమే సేకరించాం (చివరి సరిచూపు: '+D.built+'). పథకాలు మారవచ్చు - దరఖాస్తు చేయడానికి ముందు "మూలం" లింక్ తప్పక చూడండి. ఈ యాప్ మీ వ్యక్తిగత సమాచారాన్ని ఎక్కడా నిల్వ చేయదు.',
    'Note: all information is collected only from official government websites (last checked: '+D.built+'). Schemes can change - always check the "Source" link before applying. This app stores no personal data.');
  $('foot').innerHTML = T('సృష్టికర్త','Created by') + ' <b>D. Srinivas</b> · ' + T('సహాయం కావాలంటే:','For help:') + ' <a href="tel:+919177226638" style="color:#4ade80;text-decoration:none">📞 91772 26638</a>';
  // emergency
  $('searchBox').placeholder = T('🔍 పథకం పేరు టైప్ చేయండి... (ఉదా: పెన్షన్, బీమా)','🔍 Type a scheme name... (e.g. pension, insurance)');
  $('emgVer').textContent = '✓ ' + T('అధికారిక సైట్లతో సరిచూశాం','Verified with official sites') + ': ' + (D.emergencyVerified || D.built);
  $('ntTitle').textContent = T('📢 గ్రామ నోటీసులు','📢 Village notices');
  $('ntList').innerHTML = (D.notices && D.notices.length) ? D.notices.map(n =>
    '<div class="nitem"><span class="ntag '+(n.off?'off':'unoff')+'">'+(n.off?T('అధికారిక','Official'):T('ధృవీకరించని','Unverified'))+'</span>'+T(n.t,n.e)+' <span class="nd">'+n.date+(n.exp?' → '+T('గడువు','expires')+' '+n.exp:'')+'</span></div>').join('')
    : '<div class="nempty">'+T('ప్రస్తుతం కొత్త నోటీసులు లేవు','No new notices right now')+'</div>';
  $('emgGrid').innerHTML = D.emergency.map(e =>
    '<a class="ebtn" href="tel:'+e.n+'"><b>'+e.n+'</b><span>'+T(e.te,e.en)+'</span></a>').join('');
  // sections
  $('secGrid').innerHTML = D.sections.map(s =>
    '<div class="sec" role="button" tabindex="0" aria-label="'+T(s.te,s.en)+'" onclick="openSec(\''+s.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openSec(\''+s.id+'\')}"><div class="ic">'+s.icon+'</div><h2>'+T(s.te,s.en)+'</h2><p>'+s.items.length+' '+T('పథకాలు/సేవలు','schemes & services')+'</p></div>').join('') +
  '<div class="sec" role="button" tabindex="0" aria-label="complaint" onclick="openSpecial(\'complaint\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openSpecial(\'complaint\')}"><div class="ic">📝</div><h2>'+T('ఫిర్యాదు చేయండి','File a Complaint')+'</h2><p>'+T('రోడ్డు, నీరు, కరెంటు, పారిశుధ్యం','road, water, power, sanitation')+'</p></div>' +
  '<div class="sec" role="button" tabindex="0" aria-label="offices" onclick="openSpecial(\'offices\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openSpecial(\'offices\')}"><div class="ic">🏢</div><h2>'+T('మండల కార్యాలయాలు','Mandal Offices')+'</h2><p>'+T('అధికారిక ఫోన్ నంబర్లు','official phone numbers')+'</p></div>';
}
function openSec(id){
  const s = D.sections.find(x=>x.id===id);
  stopSpeak();
  closeSearch(); $('searchBox').value='';
  $('secGrid').style.display='none'; $('emgBox').style.display='none';
  $('backBtn').style.display='inline-flex'; $('secTitle').style.display='flex'; $('cardList').style.display='flex';
  $('stIcon').textContent = s.icon; $('stName').textContent = T(s.te,s.en);
  $('cardList').innerHTML = s.items.map((it,i)=>renderCard(id,i,it)).join('');
  window.scrollTo(0,0);
}
function goBack(){
  stopSpeak();
  closeSearch(); $('searchBox').value='';
  $('secGrid').style.display='grid'; $('emgBox').style.display='block';
  $('backBtn').style.display='none'; $('secTitle').style.display='none'; $('cardList').style.display='none';
  $('noticeBox').style.display='block';
}
$('backBtn').onclick = goBack;
$('langBtn').onclick = ()=>{ lang = lang==='te'?'en':'te'; localStorage.setItem('gs.lang',lang); stopSpeak(); const open = $('cardList').style.display==='flex'; const id = $('stName').dataset.sid; render(); if(open && id){ id.startsWith('special:') ? openSpecial(id.slice(8)) : openSec(id); } };
// track open section for lang re-render
const origOpen = openSec; openSec = function(id){ $('stName').dataset.sid=id; origOpen(id); };

// ---- Shared card renderer (section view + search results) ----
function detRow(ic, lab, val){ return val ? '<div class="det"><span class="dic">'+ic+'</span><div><b>'+lab+':</b> '+val+'</div></div>' : ''; }
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderCard(sid, i, it){
  const dk = Object.keys(window.GS_DETAILS||{}).find(k=>it.e.includes(k));
  const dd = dk ? GS_DETAILS[dk] : null;
  return '<div class="card"><h3>'+T(it.t,it.e)+'</h3><div class="desc">'+T(it.d,it.de)+'</div>'+
    '<div class="dets">'+
    detRow('✅',T('అర్హత','Eligibility'), dd ? T(dd[0],dd[1]) : null)+
    detRow('📄',T('కావాల్సిన పత్రాలు','Documents'), dd ? T(dd[2],dd[3]) : null)+
    detRow('📝',T('దరఖాస్తు విధానం','How to apply'), dd ? T(dd[4],dd[5]) : null)+
    '<div class="det disc"><span class="dic">⚠️</span><div>'+T('చివరి నిర్ధారణ అధికారిక వెబ్‌సైట్ / కార్యాలయం ద్వారానే చేసుకోండి.','Always confirm final details on the official website / office.')+'</div></div>'+
    '</div>'+
    '<div class="meta"><a class="chip src" href="'+it.s+'" target="_blank" rel="noopener">🔗 '+T('మూలం','Source')+': '+it.sn+'</a><span class="chip upd">🕒 '+T('సరిచూసిన తేదీ','Checked')+': '+it.u+'</span></div>'+
    '<div class="cbtns"><button class="cbtn listen" aria-label="'+T('వినండి','Listen')+'" onclick="speakItem(\''+sid+'\','+i+')">🔊 '+T('వినండి','Listen')+'</button>'+
    '<a class="cbtn open" href="'+it.s+'" target="_blank" rel="noopener">🌐 '+T('లింక్ తెరవండి','Open link')+'</a>'+
    (it.ph?'<a class="cbtn tel" href="tel:'+it.ph+'">📞 '+T('కాల్','Call')+'</a>':'')+'</div></div>';
}

// ---- Scheme search (Telugu + English) ----
$('searchBox').addEventListener('input', e => {
  const raw = e.target.value.trim();
  const q = raw.toLowerCase();
  if(q.length < 2){ closeSearch(); return; }
  stopSpeak();
  const res = [];
  D.sections.forEach(s => s.items.forEach((it,i) => {
    if((it.t+' '+it.e+' '+it.d+' '+it.de+' '+s.te+' '+s.en).toLowerCase().includes(q)) res.push({s, it, i});
  }));
  $('secGrid').style.display='none'; $('emgBox').style.display='none'; $('noticeBox').style.display='none';
  $('backBtn').style.display='none'; $('secTitle').style.display='none'; $('cardList').style.display='none';
  const sr = $('searchResults'); sr.style.display='flex';
  sr.innerHTML = res.length
    ? res.map(r => '<div class="srctag">'+r.s.icon+' '+T(r.s.te,r.s.en)+'</div>'+renderCard(r.s.id, r.i, r.it)).join('')
    : '<div class="empty">'+T('దురదృష్టం - "'+esc(raw)+'" తో పథకం కనబడలేదు. మరో పేరుతో ప్రయత్నించండి (ఉదా: పెన్షన్, విద్య, బీమా)','Sorry - no scheme matches "'+esc(raw)+'". Try another word (e.g. pension, education, insurance)')+'</div>';
});
function closeSearch(){
  const sr = $('searchResults'); sr.style.display='none'; sr.innerHTML='';
  if($('cardList').style.display !== 'flex'){
    $('secGrid').style.display='grid'; $('emgBox').style.display='block'; $('noticeBox').style.display='block';
  }
}

// ---- Special views: complaint form + mandal offices directory ----
function openSpecial(id){
  stopSpeak();
  closeSearch(); $('searchBox').value='';
  $('secGrid').style.display='none'; $('emgBox').style.display='none'; $('noticeBox').style.display='none';
  $('backBtn').style.display='inline-flex'; $('secTitle').style.display='flex'; $('cardList').style.display='flex';
  $('stName').dataset.sid = 'special:' + id;
  if(id === 'offices'){
    $('stIcon').textContent = '🏢'; $('stName').textContent = T('మండల కార్యాలయాలు','Mandal Offices');
    $('cardList').innerHTML = D.directory.map((it,i) =>
      '<div class="card"><h3>'+T(it.t,it.e)+'</h3><div class="desc">'+T(it.d,it.de)+'</div>'+
      '<div class="meta">'+(it.unverified ? '<span class="chip unv">⚠️ '+T('స్థానిక నంబర్ ధృవీకరించలేదు','local number unverified')+'</span>' : (it.em ? '<a class="mailchip" href="mailto:'+it.em+'">✉️ '+it.em+'</a>' : ''))+
      '<a class="chip src" href="'+it.s+'" target="_blank" rel="noopener">🔗 '+T('మూలం','Source')+': '+it.sn+'</a><span class="chip upd">🕒 '+T('సరిచూసిన తేదీ','Checked')+': '+it.u+'</span></div>'+
      '<div class="cbtns">'+(it.ph ? '<a class="cbtn tel" href="tel:'+it.ph+'">📞 '+it.ph+'</a>' : '')+
      '<button class="cbtn listen" onclick="speakDir('+i+')">🔊 '+T('వినండి','Listen')+'</button></div></div>').join('');
  } else {
    $('stIcon').textContent = '📝'; $('stName').textContent = T('ఫిర్యాదు చేయండి','File a Complaint');
    $('cardList').innerHTML =
    '<div class="card frm">'+
    '<label id="lc">'+T('సమస్య విభాగం *','Problem category *')+'</label>'+
    '<select id="fCat"><option value="">'+T('-- ఎంచుకోండి --','-- choose --')+'</option><option>'+T('రోడ్డు','Road')+'</option><option>'+T('మంచినీరు','Drinking water')+'</option><option>'+T('విద్యుత్','Electricity')+'</option><option>'+T('పారిశుధ్యం','Sanitation')+'</option></select>'+
    '<label>'+T('సమస్య వివరాలు *','Problem details *')+'</label><textarea id="fDesc" placeholder="'+T('ఉదా: మా వీధిలో రోడ్డు పగిలి గొయ్యిలు ఏర్పడ్డాయి...','e.g. the road on our street is broken with potholes...')+'"></textarea>'+
    '<label>'+T('సమస్య ఉన్న చోటు','Location of the problem')+'</label><input id="fLoc" placeholder="'+T('ఉదా: మెయిన్ రోడ్డు, బస్టాండ్ దగ్గర','e.g. main road, near bus stand')+'">'+
    '<label>'+T('మీ పేరు (ఇవ్వకపోవచ్చు)','Your name (optional)')+'</label><input id="fName">'+
    '<label>'+T('మీ మొబైల్ (ఇవ్వకపోవచ్చు)','Your mobile (optional)')+'</label><input id="fMob" type="tel" inputmode="numeric" maxlength="10">'+
    '<div class="privacy">🔒 '+T('గోప్యత: ఈ యాప్ మీ సమాచారాన్ని ఎక్కడా నిల్వ చేయదు, ఏ సర్వర్‌కీ పంపదు. "పంపండి" నొక్కితే మీ ఫోన్‌లో WhatsApp తెరుస్తుంది - అక్కడ మీరే సందేశం చూసి, మీ స్వంత నంబర్ నుండి పంపుతారు (D. Srinivas గారికి, 91772 26638).','Privacy: this app stores nothing and sends nothing to any server. Tapping Send opens WhatsApp on your phone - you review the message and send it yourself from your own number to D. Srinivas, 91772 26638.')+'</div>'+
    '<button class="sendbtn" onclick="sendComplaint()">📤 '+T('WhatsApp లో పంపండి','Send via WhatsApp')+'</button>'+
    '</div>'+
    '<div class="srctag">🏛️ '+T('అధికారిక ఫిర్యాదు మార్గాలు కూడా','Official grievance channels too')+'</div>'+
    D.grievance.map((g,i) =>
      '<div class="card"><h3>'+T(g.t,g.e)+'</h3><div class="desc">'+T(g.d,g.de)+'</div>'+
      '<div class="meta"><a class="chip src" href="'+g.s+'" target="_blank" rel="noopener">🔗 '+T('మూలం','Source')+': '+g.sn+'</a><span class="chip upd">🕒 '+T('సరిచూసిన తేదీ','Checked')+': '+g.u+'</span></div>'+
      '<div class="cbtns"><a class="cbtn open" href="'+g.s+'" target="_blank" rel="noopener">🌐 '+T('లింక్ తెరవండి','Open link')+'</a>'+
      (g.ph ? '<a class="cbtn tel" href="tel:'+g.ph+'">📞 '+g.ph+'</a>' : '')+
      '<button class="cbtn listen" onclick="speakGrv('+i+')">🔊 '+T('వినండి','Listen')+'</button></div></div>').join('');
  }
  window.scrollTo(0,0);
}
function sendComplaint(){
  const clean = s => s.replace(/<[^>]*>/g, '').trim();
  const cat = $('fCat').value, desc = clean($('fDesc').value), loc = clean($('fLoc').value);
  const name = clean($('fName').value), mob = $('fMob').value.trim();
  if(!cat || !desc){ toast(T('దయచేసి విభాగం మరియు సమస్య వివరాలు తప్పక ఇవ్వండి','Please choose a category and describe the problem')); return; }
  if(mob && !/^\d{10}$/.test(mob)){ toast(T('మొబైల్ నంబర్ 10 అంకెలు ఉండాలి','Mobile number must be 10 digits')); return; }
  const lines = ['['+T('గ్రామ ఫిర్యాదు - బండపోతుగల్','Village complaint - Bandapothugal')+']',
    T('విభాగం','Category')+': '+cat,
    T('వివరాలు','Details')+': '+desc];
  if(loc) lines.push(T('చోటు','Location')+': '+loc);
  if(name) lines.push(T('పేరు','Name')+': '+name);
  if(mob) lines.push(T('మొబైల్','Mobile')+': '+mob);
  window.open('https://wa.me/919177226638?text=' + encodeURIComponent(lines.join('\n')), '_blank', 'noopener');
}
function speakDir(i){ const it = D.directory[i]; speak(T(it.t,it.e) + '. ' + T(it.d,it.de)); }
function speakGrv(i){ const g = D.grievance[i]; speak(T(g.t,g.e) + '. ' + T(g.d,g.de)); }

// ---- Voice (explicit tap only) ----
let queue = [];
let voiceWarned = false;
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices(); }catch(e){}
function hasVoiceFor(l){ try{ return speechSynthesis.getVoices().some(v=>v.lang && v.lang.toLowerCase().startsWith(l)); }catch(e){ return false; } }
function speak(text){
  if(!('speechSynthesis' in window)){ toast(T('ఈ ఫోన్‌లో వాయిస్ సపోర్ట్ లేదు','Voice not supported on this phone')); return; }
  speechSynthesis.cancel();
  queue = [text]; runQueue();
}
function runQueue(){
  if(!queue.length){ $('stopBtn').style.display='none'; return; }
  const want = lang==='te' ? 'te' : 'en';
  if(!voiceWarned && !hasVoiceFor(want)){
    voiceWarned = true;
    toast(T('ఈ ఫోన్‌లో తెలుగు వాయిస్ ఇన్‌స్టాల్ లేదు - అందుబాటులో ఉన్న వాయిస్‌తో ప్లే అవుతుంది','This phone has no Telugu voice installed - playing with the available voice'));
  }
  $('stopBtn').style.display='flex';
  const u = new SpeechSynthesisUtterance(queue.shift());
  u.lang = lang==='te' ? 'te-IN' : 'en-IN'; u.rate = 0.95;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(v=>v.lang && v.lang.toLowerCase().startsWith(want));
  if(v) u.voice = v;
  u.onend = runQueue; u.onerror = runQueue;
  speechSynthesis.speak(u);
}
function stopSpeak(){ queue=[]; try{speechSynthesis.cancel()}catch(e){} $('stopBtn').style.display='none'; }
$('stopBtn').onclick = stopSpeak;
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopSpeak(); });
window.addEventListener('pagehide', stopSpeak);
function speakItem(secId, i){
  const s = D.sections.find(x=>x.id===secId); const it = s.items[i];
  speak(T(it.t,it.e) + '. ' + T(it.d,it.de));
}
$('listenAll').onclick = ()=>{
  const id = $('stName').dataset.sid; const s = D.sections.find(x=>x.id===id);
  if(!('speechSynthesis' in window)){ toast(T('ఈ ఫోన్‌లో వాయిస్ సపోర్ట్ లేదు','Voice not supported on this phone')); return; }
  speechSynthesis.cancel();
  queue = s.items.map(it => T(it.t,it.e) + '. ' + T(it.d,it.de));
  runQueue();
};
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',4500); }

// ---- Install (PWA) ----
let deferredPrompt = null;
const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
const installedNow = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function setInstallUI(st){
  const b = $('installBtn');
  b.style.display = 'flex'; b.dataset.st = st;
  if(st === 'installed'){ b.textContent = '✅'; b.classList.add('done'); }
  else { b.textContent = '⬇️'; b.classList.remove('done'); }
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if($('installBtn').dataset.st !== 'installed') setInstallUI('prompt'); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; setInstallUI('installed'); });
$('installBtn').onclick = async () => {
  const st = $('installBtn').dataset.st;
  if(st === 'installed'){ toast(T('యాప్ ఇప్పటికే ఇన్‌స్టాల్ అయి ఉంది ✅','The app is already installed ✅')); return; }
  if(deferredPrompt){
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice; deferredPrompt = null;
    if(r.outcome !== 'accepted') setInstallUI(isIos ? 'ios' : 'generic');
    return;
  }
  if(isIos){ toast(T('iPhone: Safari లో క్రింది Share (⬆️) బటన్ → "Add to Home Screen" నొక్కండి','iPhone: in Safari tap the Share (⬆️) button → "Add to Home Screen"')); return; }
  toast(T('బ్రౌజర్ మెనూ (⋮ పైన కుడివైపు) తెరిచి "యాప్‌ను ఇన్‌స్టాల్ చేయండి" లేదా "Add to Home screen" నొక్కండి','Open the browser menu (⋮ top right) and tap "Install app" or "Add to Home screen"'));
};
if(installedNow) setInstallUI('installed'); else setInstallUI(isIos ? 'ios' : 'generic');

// ---- Offline indicator ----
function updNet(){
  const off = !navigator.onLine;
  $('offBanner').style.display = off ? 'block' : 'none';
  if(off) $('offBanner').textContent = T('⚠️ ఇంటర్నెట్ కనెక్షన్ లేదు - సేవ్ చేసిన సమాచారం చూపిస్తున్నాం; కొంత సమాచారం పాతది కావచ్చు','⚠️ No internet connection - showing saved information; some details may be outdated');
}
window.addEventListener('online', updNet);
window.addEventListener('offline', updNet);

render();
updNet();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
