<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef2f7">
<title>బండపోతుగల్ గ్రామ సేవ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#eef2f7;color:#1c2733;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:
 radial-gradient(600px 400px at 80% -10%,rgba(22,163,74,.09),transparent 60%),
 radial-gradient(500px 380px at -10% 40%,rgba(37,99,235,.09),transparent 60%),
 radial-gradient(500px 400px at 60% 110%,rgba(234,88,12,.07),transparent 60%),#eef2f7}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.08);margin:0 -14px;padding:12px 14px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#14532d,#166534 40%,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(34,197,94,.35);flex:none}
h1{font-size:18px;font-weight:800;line-height:1.22;letter-spacing:.3px;background:linear-gradient(90deg,#15803d,#1d4ed8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11px;color:#5a6b7f;margin-top:2px;line-height:1.4}
.hbtns{margin-left:auto;display:flex;gap:8px}
.pill{border:1px solid rgba(0,0,0,.14);background:#fff;color:#1c2733;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer}
.pill:active{transform:scale(.95)}
.pill.call{background:linear-gradient(135deg,#059669,#10b981);border:none;box-shadow:0 3px 10px rgba(16,185,129,.4);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.emg{margin:14px 0 4px;background:linear-gradient(135deg,rgba(220,38,38,.09),rgba(220,38,38,.04));border:1px solid rgba(220,38,38,.25);border-radius:16px;padding:12px}
.emg .et{font-size:12px;font-weight:800;color:#b91c1c;letter-spacing:.5px;margin-bottom:8px}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ebtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1px solid rgba(220,38,38,.3);border-radius:12px;padding:9px 4px;text-decoration:none;color:#1c2733}
.ebtn b{font-size:17px;color:#dc2626}
.ebtn span{font-size:10px;color:#5a6b7f;text-align:center;line-height:1.25}
.ebtn:active{transform:scale(.94)}
.secs{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{background:#fff;border:1px solid rgba(0,0,0,.08);border-top:4px solid #16a34a;border-radius:18px;padding:18px 14px;cursor:pointer;transition:.15s;box-shadow:0 2px 10px rgba(15,40,80,.06)}
.sec:nth-child(6n+2){border-top-color:#2563eb}.sec:nth-child(6n+3){border-top-color:#ea580c}.sec:nth-child(6n+4){border-top-color:#7c3aed}.sec:nth-child(6n+5){border-top-color:#0d9488}.sec:nth-child(6n){border-top-color:#dc2626}
.sec:active{transform:scale(.96)}
.sec .ic{font-size:30px}
.sec h2{font-size:17px;margin:8px 0 3px;font-weight:800}
.sec p{font-size:11px;color:#5a6b7f}
.back{display:none;align-items:center;gap:6px;background:#fff;border:1px solid rgba(0,0,0,.14);color:#1c2733;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;margin:14px 0 4px}
.back:active{transform:scale(.95)}
.sectitle{display:none;margin:10px 0 12px;align-items:center;gap:10px}
.sectitle .ic{font-size:26px}
.sectitle h2{font-size:20px;font-weight:800}
.listenall{margin-left:auto;font-size:11px;border:1px solid rgba(37,99,235,.4);background:rgba(37,99,235,.1);color:#1d4ed8;border-radius:16px;padding:7px 12px;font-weight:700;cursor:pointer}
.cards{display:none;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(15,40,80,.05)}
.card h3{font-size:15.5px;font-weight:800;margin-bottom:6px;line-height:1.35}
.card .desc{font-size:13px;color:#3f4f63;line-height:1.6;white-space:pre-line}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:15px}
.calnav{border:1px solid rgba(0,0,0,.14);background:#fff;border-radius:10px;padding:6px 14px;font-size:16px;font-weight:800;cursor:pointer;color:#1c2733}
.calnav:disabled{opacity:.35;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .dow{font-weight:800;color:#5a6b7f;font-size:10.5px;padding:2px 0}
.calcell{padding:6px 0;border-radius:8px;background:#f8fafc;font-size:12.5px}
.calcell.hol{background:#fee2e2;color:#b91c1c;font-weight:800}
.calcell.today{outline:2px solid #1d4ed8}
.calhol{margin-top:10px;font-size:12.5px;color:#3f4f63;line-height:1.6;white-space:pre-line}
.calcres{margin-top:10px;padding:10px;background:#f0fdf4;border:1px solid rgba(5,150,105,.25);border-radius:10px;font-size:13.5px;line-height:1.7;white-space:pre-line;display:none}
.meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:10.5px;border-radius:12px;padding:4px 9px}
.chip.src{background:rgba(37,99,235,.1);color:#1d4ed8;border:1px solid rgba(37,99,235,.3);text-decoration:none}
.chip.upd{background:#f1f5f9;color:#64748b;border:1px solid rgba(0,0,0,.08)}
.cbtns{margin-top:10px;display:flex;gap:8px}
.cbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px;font-size:12.5px;font-weight:800;cursor:pointer;text-decoration:none;border:1px solid rgba(0,0,0,.14);background:#fff;color:#1c2733}
.cbtn:active{transform:scale(.95)}
.cbtn.listen{background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;box-shadow:0 3px 12px rgba(168,85,247,.35)}
.cbtn.open{background:linear-gradient(135deg,#1d4ed8,#3b82f6);border:none;color:#fff;box-shadow:0 3px 12px rgba(59,130,246,.35)}
.cbtn.tel{background:linear-gradient(135deg,#059669,#10b981);border:none;color:#fff}
.note{margin-top:18px;font-size:11px;color:#64748b;line-height:1.6;background:rgba(255,255,255,.7);border:1px dashed rgba(0,0,0,.15);border-radius:12px;padding:10px 12px}
footer{margin-top:22px;text-align:center;font-size:12px;color:#64748b}
footer b{color:#334155}
#installBtn{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-size:24px;box-shadow:0 6px 20px rgba(16,185,129,.5);cursor:pointer;display:none;align-items:center;justify-content:center}
#installBtn.done{background:linear-gradient(135deg,#166534,#22c55e)}
#installBtn:active{transform:scale(.92)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1e293b;border:1px solid rgba(255,255,255,.15);color:#e8ecf4;font-size:12.5px;padding:11px 16px;border-radius:12px;z-index:60;display:none;max-width:86%;text-align:center;line-height:1.5}
.offb{display:none;position:sticky;top:66px;z-index:9;margin:10px 0 0;background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.4);color:#b45309;font-size:12px;font-weight:700;border-radius:12px;padding:9px 12px;line-height:1.45}
.sbox{margin:14px 0 0}
.sbox input{width:100%;background:#fff;border:1px solid rgba(0,0,0,.14);border-radius:14px;padding:13px 16px;font-size:15px;color:#1c2733;outline:none}
.sbox input:focus{border-color:#16a34a}
.sbox input::placeholder{color:#94a3b8}
.newbadge{display:inline-block;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:2px 8px;margin-top:6px;letter-spacing:.5px}
.notices{margin:14px 0 0;background:rgba(37,99,235,.05);border:1px solid rgba(37,99,235,.22);border-radius:16px;padding:12px}
.notices .nt{font-size:12px;font-weight:800;color:#1d4ed8;letter-spacing:.4px;margin-bottom:6px}
.nitem{font-size:12.5px;color:#3f4f63;line-height:1.55;padding:7px 0;border-top:1px dashed rgba(0,0,0,.1)}
.nitem .ntag{font-size:10px;border-radius:10px;padding:2px 8px;margin-right:6px}
.nitem .off{background:rgba(22,163,74,.12);color:#15803d}
.nitem .unoff{background:rgba(217,119,6,.12);color:#b45309}
.nitem .nd{color:#94a3b8;font-size:11px}
.nempty{font-size:12px;color:#94a3b8}
.dets{margin-top:9px;border-top:1px dashed rgba(0,0,0,.12);padding-top:8px}
.det{display:flex;gap:8px;font-size:12.5px;color:#3f4f63;margin-top:5px;line-height:1.5}
.det b{color:#1c2733}
.dic{flex:none}
.disc{color:#64748b;font-size:11px;margin-top:8px}
.ever{font-size:10px;color:#94a3b8;margin-top:8px}
.srctag{font-size:11px;font-weight:800;color:#64748b;margin:4px 0 -4px}
.empty{background:#fff;border:1px dashed rgba(0,0,0,.16);border-radius:14px;padding:18px;text-align:center;font-size:13px;color:#5a6b7f;line-height:1.6}
:focus-visible{outline:2px solid #16a34a;outline-offset:2px;border-radius:8px}
.frm label{display:block;font-size:13px;font-weight:700;color:#3f4f63;margin:12px 0 5px}
.frm input,.frm textarea,.frm select{width:100%;background:#fff;border:1px solid rgba(0,0,0,.14);border-radius:12px;padding:12px 14px;font-size:15px;color:#1c2733;outline:none;font-family:inherit}
.frm input:focus,.frm textarea:focus,.frm select:focus{border-color:#16a34a}
.frm textarea{min-height:90px;resize:vertical}
.frm select{appearance:none}
.frm .inrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.frm .inrow>input{flex:1 1 140px;min-width:120px;width:auto}
.frm .inrow>select,.frm .inrow>div{flex:1 1 90px;min-width:70px;width:auto;max-width:60%}
.frm .inrow select{max-width:100%}
.privacy{margin-top:12px;font-size:11.5px;color:#5a6b7f;line-height:1.6;background:rgba(217,119,6,.06);border:1px dashed rgba(217,119,6,.4);border-radius:12px;padding:10px 12px}
.sendbtn{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#16a34a,#22c55e);border:none;color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(34,197,94,.4);text-decoration:none}
.sendbtn:active{transform:scale(.97)}
.mailchip{font-size:10.5px;border-radius:12px;padding:4px 9px;background:rgba(124,58,237,.1);color:#6d28d9;border:1px solid rgba(124,58,237,.3);text-decoration:none}
.unv{background:rgba(217,119,6,.12);color:#b45309;border:1px solid rgba(217,119,6,.4)}
.stopbtn{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-size:22px;box-shadow:0 6px 20px rgba(239,68,68,.5);cursor:pointer;display:none;align-items:center;justify-content:center}

.hrow>div:nth-child(2){min-width:0;flex:1}.hbtns{flex:none;align-items:center;gap:5px}
.notifybtn{position:relative;min-width:44px;min-height:44px;padding:7px;background:#f0fdf4;border-color:#86efac;font-size:20px}
.notifycount{position:absolute;right:-4px;top:-5px;min-width:21px;height:21px;padding:0 4px;display:grid;place-items:center;border-radius:15px;background:#15803d;color:white;border:2px solid white;font-size:11px;font-weight:800}
.notifycount[hidden]{display:none}
#notifyDialog{margin:auto;width:calc(100% - 24px);max-width:492px;max-height:85dvh;border:1px solid #bbf7d0;border-radius:18px;padding:16px;color:#1c2733;background:#f8fafc;overflow-y:auto;overflow-wrap:anywhere}
#notifyDialog::backdrop{background:rgba(15,23,42,.5)}
.nhead{display:flex;align-items:center;gap:8px}.nhead h2{font-size:18px;flex:1}.nhead button{min-width:44px;min-height:44px}
#notifyInfo,#notifyState{font-size:12px;line-height:1.6;margin:10px 0;color:#475569}
#notifyRefresh{min-height:44px;margin-bottom:10px}.ncard{padding:14px;background:white;border:1px solid #d1d5db;border-radius:14px;margin:10px 0;font-size:14px;line-height:1.6}.ncard h3{font-size:16px}.ncard .nmeta{font-size:11px;color:#475569;margin:8px 0}.ncard a{display:block;padding:10px 0;color:#166534}.ncard button{min-height:44px;border:1px solid #86efac;background:#f0fdf4;color:#14532d;border-radius:10px;padding:8px;cursor:pointer}.ncard button:disabled{color:#475569;background:#f1f5f9;border-color:#cbd5e1}.ncard blockquote{padding:8px;background:#f1f5f9;font-size:12px}.ncard summary{cursor:pointer;min-height:44px;padding:8px 0}
@media(max-width:360px){h1{font-size:16px}.logo{width:34px;height:34px;font-size:20px}.hrow{gap:6px}.pill{padding:7px 10px}.sub{font-size:10px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap" role="main">
<header role="banner">
  <div class="hrow">
    <div class="logo">🌾</div>
    <div>
      <h1 id="appTitle">బండపోతుగల్ గ్రామ సేవ</h1>
      <div class="sub" id="villageLine"></div>
    </div>
    <div class="hbtns">
      <button class="pill notifybtn" id="notifyBtn" aria-haspopup="dialog" aria-label="పథకాల సమాచారం"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/></svg><span class="notifycount" id="notifyCount" hidden>0</span></button>
      <button class="pill" id="langBtn">EN</button>
    </div>
  </div>
</header>

<div class="offb" id="offBanner" role="status"></div>

<div class="sbox"><input id="searchBox" type="search" autocomplete="off" aria-label="Search schemes"></div>

<div class="emg" id="emgBox">
  <div class="et" id="emgTitle">🚨 అత్యవసర నంబర్లు</div>
  <div class="egrid" id="emgGrid"></div>
  <div class="ever" id="emgVer"></div>
</div>

<div class="notices" id="noticeBox"><div class="nt" id="ntTitle"></div><div id="ntList"></div></div>

<div class="secs" id="secGrid"></div>
<div class="cards" id="searchResults" style="display:none"></div>

<button class="back" id="backBtn">← <span id="backLbl">వెనుకకు</span></button>
<div class="sectitle" id="secTitle">
  <span class="ic" id="stIcon"></span><h2 id="stName"></h2>
  <button class="listenall" id="listenAll">🔊 <span id="listenAllLbl">అన్నీ వినండి</span></button>
</div>
<div class="cards" id="cardList"></div>

<div class="note" id="note"></div>
<footer id="foot"></footer>
</div>

<dialog id="notifyDialog" aria-labelledby="notifyTitle">
<div class="nhead"><h2 id="notifyTitle">కొత్త పథకాల సమాచారం</h2><button class="pill" id="notifyClose" aria-label="మూసివేయండి">✕</button></div>
<p id="notifyInfo"></p><p id="notifyState" role="status"></p><button class="pill" id="notifyRefresh">మళ్ళీ చూడండి</button><div id="notifyList"></div>
</dialog>
<button class="stopbtn" id="stopBtn" title="Stop">⏹</button>
<button id="installBtn" title="Install">⬇️</button>
<div id="toast"></div>

<script src="schemes.js?v=60"></script>
<script src="details.js?v=60"></script>
<script>
let lang = localStorage.getItem('gs.lang') || 'te';
const D = window.GS_DATA;
const $ = id => document.getElementById(id);
const T = (te,en) => lang==='te' ? te : en;

function render(){
  document.documentElement.lang = lang;
  document.dispatchEvent(new Event('gs-language'));
  $('appTitle').innerHTML = T('బండపోతుగల్ గ్రామ<br>సేవ','Bandapothugal<br>Gram Seva');
  $('villageLine').textContent = T(D.village.te, D.village.en);
  $('langBtn').textContent = lang==='te' ? 'EN' : 'తె';
  $('emgTitle').textContent = T('🚨 అత్యవసర నంబర్లు','🚨 Emergency numbers');
  $('backLbl').textContent = T('వెనుకకు','Back');
  $('listenAllLbl').textContent = T('అన్నీ వినండి','Listen to all');
  $('note').textContent = T(
    'గమనిక: ఈ సమాచారమంతా అధికారిక ప్రభుత్వ వెబ్‌సైట్ల నుండి మాత్రమే సేకరించాం (చివరి సరిచూపు: '+D.built+'). పథకాలు మారవచ్చు - దరఖాస్తు చేయడానికి ముందు "మూలం" లింక్ తప్పక చూడండి. ఈ యాప్ మీ వ్యక్తిగత సమాచారాన్ని ఎక్కడా నిల్వ చేయదు.',
    'Note: all information is collected only from official government websites (last checked: '+D.built+'). Schemes can change - always check the "Source" link before applying. This app stores no personal data.');
  $('foot').innerHTML = T('సృష్టికర్త','Created by') + ' <b>D. Srinivas</b>';
  // emergency
  $('searchBox').placeholder = T('🔍 పథకం పేరు టైప్ చేయండి... (ఉదా: పెన్షన్, బీమా)','🔍 Type a scheme name... (e.g. pension, insurance)');
  $('emgVer').textContent = '✓ ' + T('అధికారిక సైట్లతో సరిచూశాం','Verified with official sites') + ': ' + (D.emergencyVerified || D.built);
  $('ntTitle').textContent = T('📢 గ్రామ నోటీసులు','📢 Village notices');
  $('ntList').innerHTML = (D.notices && D.notices.length) ? D.notices.map(n =>
    '<div class="nitem"><span class="ntag '+(n.off?'off':'unoff')+'">'+(n.off?T('అధికారిక','Official'):T('ధృవీకరించని','Unverified'))+'</span>'+T(n.t,n.e)+' <span class="nd">'+n.date+(n.exp?' → '+T('గడువు','expires')+' '+n.exp:'')+'</span></div>').join('')
    : '<div class="nempty">'+T('ప్రస్తుతం కొత్త నోటీసులు లేవు','No new notices right now')+'</div>';
  $('emgGrid').innerHTML = D.emergency.map(e =>
    '<a class="ebtn" href="tel:'+e.n+'"><b>'+e.n+'</b><span>'+T(e.te,e.en)+'</span></a>').join('');
  // sections
  $('secGrid').innerHTML = D.sections.map(s =>
    '<div class="sec" role="button" tabindex="0" aria-label="'+T(s.te,s.en)+'" onclick="openSec(\''+s.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openSec(\''+s.id+'\')}"><div class="ic">'+s.icon+'</div><h2>'+T(s.te,s.en)+'</h2><p>'+s.items.length+' '+T('పథకాలు/సేవలు','schemes & services')+'</p>'+(s.nb?'<span class="newbadge">'+T('✨ కొత్తది','✨ NEW')+'</span>':'')+'</div>').join('') +

// ---- Shared card renderer (section view + search results) ----
function detRow(ic, lab, val){ return val ? '<div class="det"><span class="dic">'+ic+'</span><div><b>'+lab+':</b> '+val+'</div></div>' : ''; }
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderCard(sid, i, it){
  const dk = Object.keys(window.GS_DETAILS||{}).find(k=>it.e.includes(k));

  return '<div class="card"><h3>'+T(it.t,it.e)+'</h3><div class="desc">'+T(it.d,it.de)+'</div>'+
    '<div class="dets">'+
    detRow('✅',T('అర్హత','Eligibility'), dd ? T(dd[0],dd[1]) : null)+
    detRow('📄',T('కావాల్సిన పత్రాలు','Documents'), dd ? T(dd[2],dd[3]) : null)+
    detRow('📝',T('దరఖాస్తు విధానం','How to apply'), dd ? T(dd[4],dd[5]) : null)+
    '<div class="det disc"><span class="dic">🌐</span><div>'+T('అధికారిక లింక్ పేజీ ఇంగ్లీష్/హిందీలో ఉండవచ్చు - ముఖ్యమైన వివరాలన్నీ పైన తెలుగులోనే ఉన్నాయి.','The official link page may be in English/Hindi - all key details are in Telugu above.')+'</div></div>'+
    '<div class="det disc"><span class="dic">⚠️</span><div>'+T('చివరి నిర్ధారణ అధికారిక వెబ్‌సైట్ / కార్యాలయం ద్వారానే చేసుకోండి.','Always confirm final details on the official website / office.')+'</div></div>'+
    '</div>'+
    '<div class="meta"><a class="chip src" href="'+it.s+'" target="_blank" rel="noopener">🔗 '+T('మూలం','Source')+': '+it.sn+'</a><span class="chip upd">🕒 '+T('సరిచూసిన తేదీ','Checked')+': '+it.u+'</span></div>'+
    '<div class="cbtns"><button class="cbtn listen" aria-label="'+T('వినండి','Listen')+'" onclick="speakItem(\''+sid+'\','+i+')">🔊 '+T('వినండి','Listen')+'</button>'+
    '<a class="cbtn open" href="'+it.s+'" target="_blank" rel="noopener">🌐 '+T(it.bt || 'లింక్ తెరవండి',it.be || 'Open link')+'</a>'+

// ---- Scheme search (Telugu + English) ----
$('searchBox').addEventListener('input', e => {
  const raw = e.target.value.trim();
  const q = raw.toLowerCase();
  if(q.length < 2){ closeSearch(); return; }
  stopSpeak();
  const res = [];
  D.sections.forEach(s => s.items.forEach((it,i) => {
    if((it.t+' '+it.e+' '+it.d+' '+it.de+' '+s.te+' '+s.en).toLowerCase().includes(q)) res.push({s, it, i});
  }));
  $('secGrid').style.display='none'; $('emgBox').style.display='none'; $('noticeBox').style.display='none';
  $('backBtn').style.display='none'; $('secTitle').style.display='none'; $('cardList').style.display='none';
  const sr = $('searchResults'); sr.style.display='flex';
  sr.innerHTML = res.length
    ? res.map(r => '<div class="srctag">'+r.s.icon+' '+T(r.s.te,r.s.en)+'</div>'+renderCard(r.s.id, r.i, r.it)).join('')
    : '<div class="empty">'+T('దురదృష్టం - "'+esc(raw)+'" తో పథకం కనబడలేదు. మరో పేరుతో ప్రయత్నించండి (ఉదా: పెన్షన్, విద్య, బీమా)','Sorry - no scheme matches "'+esc(raw)+'". Try another word (e.g. pension, education, insurance)')+'</div>';
});
function closeSearch(){
  const sr = $('searchResults'); sr.style.display='none'; sr.innerHTML='';
  if($('cardList').style.display !== 'flex'){
    $('secGrid').style.display='grid'; $('emgBox').style.display='block'; $('noticeBox').style.display='block';
  }
}

      '<div class="cbtns"><a class="cbtn open" href="'+g.s+'" target="_blank" rel="noopener">🌐 '+T('లింక్ తెరవండి','Open link')+'</a>'+

  }

}

// ---- Calendar + calculators ----
const CAL_MTE = ['జనవరి','ఫిబ్రవరి','మార్చి','ఏప్రిల్','మే','జూన్','జూలై','ఆగస్టు','సెప్టెంబర్','అక్టోబర్','నవంబర్','డిసెంబర్'];
const CAL_MEN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const CAL_DOW_TE = ['ఆది','సోమ','మం','బుధ','గురు','శుక్ర','శని'];
const CAL_DOW_EN = ['Su','Mo','Tu','We','Th','Fr','Sa'];
let calMonth = (new Date().getFullYear() === GS_CAL.year) ? new Date().getMonth() : 0;
function calMove(d){ calMonth += d; if(calMonth < 0) calMonth = 0; if(calMonth > 11) calMonth = 11; calShow(); }
function calShow(){
  const y = GS_CAL.year, m = calMonth;
  $('calTitle').textContent = T(CAL_MTE[m], CAL_MEN[m]) + ' ' + y;
  $('calPrev').disabled = (m === 0); $('calNext').disabled = (m === 11);
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();

  const hol = {};
  GS_CAL.h.forEach(x => { if(x[0] === m + 1){ (hol[x[1]] = hol[x[1]] || []).push(x); } });
  let html = (lang === 'te' ? CAL_DOW_TE : CAL_DOW_EN).map(d => '<div class="dow">' + d + '</div>').join('');
  for(let i = 0; i < first; i++) html += '<div></div>';
  for(let d = 1; d <= days; d++){
    const cls = 'calcell' + (hol[d] ? ' hol' : '') + (isThisMonth && today.getDate() === d ? ' today' : '');
    html += '<div class="' + cls + '">' + d + '</div>';
  }
  $('calGrid').innerHTML = html;
  const keys = Object.keys(hol).sort((a,b) => a - b);
  $('calHol').innerHTML = keys.length ? keys.map(d => hol[d].map(x => '🎉 <b>' + d + '</b> - ' + (lang === 'te' && x[3] ? x[3] + ' (' + x[2] + ')' : (lang === 'te' ? x[2] : (x[3] ? x[2] + ' - ' + x[3] : x[2])))).join('<br>')).join('<br>') : T('ఈ నెలలో జాబితాలో సెలవులు లేవు','No listed holidays this month');
}
function fmtIN(n){ return n.toLocaleString('en-IN', {maximumFractionDigits: 2}); }
function calcSI(){
  const P = parseFloat($('siP').value), r = parseFloat($('siR').value), t = parseFloat($('siT').value);
  const res = $('siRes');
  if(!(P > 0) || !(r >= 0) || !(t > 0)){ toast(T('దయచేసి అసలు, రేటు, కాలం సరిగ్గా ఇవ్వండి (0 కంటే ఎక్కువ)','Please enter a valid principal, rate and period (above 0)')); return; }
  const rA = $('siRP').value === 'm' ? r * 12 : r;
  const tY = $('siTP').value === 'm' ? t / 12 : t;
  const I = P * (rA / 100) * tY;
  res.style.display = 'block';
  res.textContent = T('వడ్డీ','Interest') + ': ₹' + fmtIN(I) + '\n' + T('మొత్తం (అసలు + వడ్డీ)','Total (principal + interest)') + ': ₹' + fmtIN(P + I);
}
function calcEMI(){
  const P = parseFloat($('emiP').value), rA = parseFloat($('emiR').value), nm = Math.round(parseFloat($('emiN').value));
  const res = $('emiRes');
  if(!(P > 0) || !(rA >= 0) || !(nm >= 1)){ toast(T('దయచేసి లోన్ మొత్తం, రేటు, నెలల సంఖ్య సరిగ్గా ఇవ్వండి','Please enter a valid loan amount, rate and number of months')); return; }
  const r = rA / 1200;
  let emi;
  if(r === 0){ emi = P / nm; } else { const f = Math.pow(1 + r, nm); emi = P * r * f / (f - 1); }
  const total = emi * nm;
  res.style.display = 'block';
  res.textContent = T('నెలవారీ EMI','Monthly EMI') + ': ₹' + fmtIN(emi) + '\n' + T('మొత్తం వడ్డీ','Total interest') + ': ₹' + fmtIN(total - P) + '\n' + T('మొత్తం చెల్లింపు','Total payment') + ': ₹' + fmtIN(total);
}

// ---- Voice (explicit tap only) ----
let queue = [];
let voiceWarned = false;
let audioEl = null;
let playToken = 0;
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices(); }catch(e){}
function hasVoiceFor(l){ try{ return speechSynthesis.getVoices().some(v=>v.lang && v.lang.toLowerCase().startsWith(l)); }catch(e){ return false; } }
async function sha10(s){ try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,10); }catch(e){ return null; } }
function stopAudio(){ if(audioEl){ try{ audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load(); }catch(e){} audioEl = null; } }
function speak(text, id){
  if(!('speechSynthesis' in window) && !id){ toast(T('ఈ ఫోన్‌లో వాయిస్ సపోర్ట్ లేదు','Voice not supported on this phone')); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  stopAudio();
  queue = [{text: text, id: id || null}]; runQueue();
}
// Pre-generated natural-voice audio: file key = stable card id + hash of the CURRENT spoken text + lang.
// Any card text edit changes the hash -> file 404s -> device TTS fallback (stale audio can never play).
// Index is never part of the key, so reorders/insertions cannot mis-map audio to another card.
async function runQueue(){
  if(!queue.length){ $('stopBtn').style.display='none'; return; }
  const tok = ++playToken;
  $('stopBtn').style.display='flex';
  const item = queue.shift();
  if(item.id){
    const h = await sha10(item.text);
    if(tok !== playToken) return;
    if(h){
      const ok = await playAudioFile('audio/' + item.id + '-' + h + '-' + (lang==='te'?'te':'en') + '.mp3', tok);
      if(tok !== playToken) return;
      if(ok) return;
    }
  }
  speakTTS(item.text, tok);
}
function playAudioFile(url, tok){
  return new Promise(res => {
    let settled = false, wd = null;
    const done = ok => { if(settled) return; settled = true; if(wd) clearTimeout(wd); if(!ok){ try{ el.pause(); }catch(e){} if(audioEl === el) audioEl = null; } res(ok); };
    let el = null;
    try{
      el = new Audio(url);
      audioEl = el;
      el.onended = () => { done(true); if(tok === playToken) runQueue(); };
      el.onerror = () => done(false);
      const p = el.play();
      if(p && p.catch) p.catch(() => done(false));
      // Stall watchdog: play() resolving is not playback. If nothing is heard (no progress)
      // shortly after start, abandon the clip and fall back to device TTS - never hang silently.
      wd = setTimeout(() => { try{ if(!settled && !el.paused && el.currentTime === 0) done(false); }catch(e){} }, 2500);
    }catch(e){ done(false); }
  });
}
function speakTTS(text, tok){
  if(!('speechSynthesis' in window)){ toast(T('ఈ ఫోన్‌లో వాయిస్ సపోర్ట్ లేదు','Voice not supported on this phone')); if(tok === playToken) runQueue(); return; }
  const want = lang==='te' ? 'te' : 'en';
  if(!voiceWarned && !hasVoiceFor(want)){
    voiceWarned = true;
    toast(T('ఈ ఫోన్‌లో తెలుగు వాయిస్ ఇన్‌స్టాల్ లేదు - అందుబాటులో ఉన్న వాయిస్‌తో ప్లే అవుతుంది','This phone has no Telugu voice installed - playing with the available voice'));
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang==='te' ? 'te-IN' : 'en-IN'; u.rate = 0.95;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(v=>v.lang && v.lang.toLowerCase().startsWith(want));
  if(v) u.voice = v;
  u.onend = () => { if(tok === playToken) runQueue(); };
  u.onerror = () => { if(tok === playToken) runQueue(); };
  speechSynthesis.speak(u);
}
function stopSpeak(){ playToken++; queue=[]; stopAudio(); try{speechSynthesis.cancel()}catch(e){} $('stopBtn').style.display='none'; }
window.__gsAudioState = () => ({ playing: !!(audioEl && !audioEl.paused && !audioEl.ended), t: audioEl ? audioEl.currentTime : 0, src: audioEl && audioEl.currentSrc ? audioEl.currentSrc : null, speaking: (function(){ try{ return speechSynthesis.speaking; }catch(e){ return false; } })(), queued: queue.length });
$('stopBtn').onclick = stopSpeak;
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopSpeak(); });
window.addEventListener('pagehide', stopSpeak);
function speakItem(secId, i){
  const s = D.sections.find(x=>x.id===secId); const it = s.items[i];
  speak(T(it.t,it.e) + '. ' + T(it.d,it.de), it.id || null);
}
$('listenAll').onclick = ()=>{
  const id = $('stName').dataset.sid; const s = D.sections.find(x=>x.id===id);
  if(!('speechSynthesis' in window) && !s.items.some(it=>it.id)){ toast(T('ఈ ఫోన్‌లో వాయిస్ సపోర్ట్ లేదు','Voice not supported on this phone')); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  stopAudio();
  queue = s.items.map(it => ({text: T(it.t,it.e) + '. ' + T(it.d,it.de), id: it.id || null}));
  runQueue();
};
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',4500); }

// ---- Install (PWA) ----
let deferredPrompt = null;
const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
const installedNow = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function setInstallUI(st){
  const b = $('installBtn');

  if(st === 'installed'){ b.textContent = '✅'; b.classList.add('done'); }

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if($('installBtn').dataset.st !== 'installed') setInstallUI('prompt'); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; setInstallUI('installed'); });
$('installBtn').onclick = async () => {
  const st = $('installBtn').dataset.st;
  if(st === 'installed'){ toast(T('యాప్ ఇప్పటికే ఇన్‌స్టాల్ అయి ఉంది ✅','The app is already installed ✅')); return; }

    deferredPrompt.prompt();

  }
  if(isIos){ toast(T('iPhone: Safari లో క్రింది Share (⬆️) బటన్ → "Add to Home Screen" నొక్కండి','iPhone: in Safari tap the Share (⬆️) button → "Add to Home Screen"')); return; }
  toast(T('బ్రౌజర్ మెనూ (⋮ పైన కుడివైపు) తెరిచి "యాప్‌ను ఇన్‌స్టాల్ చేయండి" లేదా "Add to Home screen" నొక్కండి','Open the browser menu (⋮ top right) and tap "Install app" or "Add to Home screen"'));
};
if(installedNow) setInstallUI('installed'); else setInstallUI(isIos ? 'ios' : 'generic');

// ---- Offline indicator ----
function updNet(){
  const off = !navigator.onLine;
  $('offBanner').style.display = off ? 'block' : 'none';
  if(off) $('offBanner').textContent = T('⚠️ ఇంటర్నెట్ కనెక్షన్ లేదు - సేవ్ చేసిన సమాచారం చూపిస్తున్నాం; కొంత సమాచారం పాతది కావచ్చు','⚠️ No internet connection - showing saved information; some details may be outdated');

render();
updNet();

</script>
<script>
/* sv-voice.js v2 - app-wide female-leaning Indic voice selection for device TTS.
   Wraps speechSynthesis.speak: for te/en/hi utterances, picks the best female-leaning
   voice available on the device. Name heuristics are NOT gender proof (e.g. "Google
   తెలుగు" declares no identity); they only prefer female-named voices when present.
   No voice can be guaranteed on any device; when no matching voice exists the
   utterance plays with the system default (callers surface their own warnings). */
(function(){try{
var ss=window.speechSynthesis;if(!ss||ss.__fv)return;
var FNAMES=/\b(female|heera|priya|neerja|shruti|swara|kalpana|veena|lekha|sangeeta|aditi|raveena|zira|helena|meera|ananya|kavya|lakshmi|sulafat)\b/i;
var MNAMES=/\b(male|ravi|prabhat|hemant|madhur|mohan|rishi|arjun|vikram|kiran|rohan)\b/i;
var GOOGLE_INDIC=/google (हिन्दी|తెలుగు|english|తమిళ్|हिंदी)/i;
var cache={};
function pick(lang){
 var base=(lang||'en-IN').toLowerCase().slice(0,2);
 var want=base==='te'?'te-in':(base==='hi'?'hi-in':(base==='en'?'en-in':base));
 var vs=ss.getVoices()||[];var k=want+'|'+vs.length;if(cache[k]!==undefined)return cache[k];
 var norm=function(l){return (l||'').toLowerCase().replace('_','-')};
 var c=vs.filter(function(v){return norm(v.lang)===want});
 if(!c.length)c=vs.filter(function(v){return norm(v.lang).indexOf(base+'-')===0||norm(v.lang)===base});
 function rank(v){
  var n=(v.name||'')+' '+(v.voiceURI||'');var r=0;
  var f=FNAMES.test(n),m=MNAMES.test(n);
  if(f&&!m)r+=4;if(m)r-=4;              /* exact-token name hints only; never proof */
  if(GOOGLE_INDIC.test(n))r+=1;          /* Indic google voice: language fit, no gender claim */
  if(v.localService===false)r+=1;
  return r;
 }
 var best=c.slice().sort(function(a,b){return rank(b)-rank(a)})[0]||null;
 cache[k]=best;return best;
}
var sp=ss.speak.bind(ss);
ss.speak=function(u){try{if(u&&!u.__set){u.__set=1;var l=(u.lang||'').toLowerCase();if(/^(te|en|hi)/.test(l)){var v=pick(u.lang||'en-IN');if(v){u.voice=v;u.lang=v.lang}}}}catch(e){}return sp(u)};
ss.__fv=2;
if(ss.addEventListener)ss.addEventListener('voiceschanged',function(){cache={}});
}catch(e){}})();
</script>
